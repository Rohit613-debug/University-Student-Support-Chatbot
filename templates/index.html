
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>University Student Support Chatbot</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <main class="chat-container">

        <header class="chat-header">
            <h1>University Student Support Chatbot</h1>
            <p>Your Virtual Academic Assistant</p>
        </header>

        <section class="chat-box"
                 id="chat-box"
                 aria-label="Chat conversation"
                 aria-live="polite">

            <div class="bot-message">
                Hello! Welcome to the University Student
                Support Chatbot. How can I help you today?
            </div>

        </section>

        <form class="chat-input" id="chat-form">
            <input
                type="text"
                id="user-input"
                placeholder="Type your question here..."
                aria-label="Your question"
                required
            >

            <button type="submit" id="send-button">
                Send
            </button>
        </form>

    </main>
<script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
